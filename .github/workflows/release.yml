name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      core--release_created: ${{ steps.release.outputs['packages/core--release_created'] }}
      vanilla--release_created: ${{ steps.release.outputs['packages/vanilla--release_created'] }}
      react--release_created: ${{ steps.release.outputs['packages/react--release_created'] }}
      vue--release_created: ${{ steps.release.outputs['packages/vue--release_created'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      # Publish core first (others depend on it)
      - name: Publish @skedox/analytics-core
        if: ${{ needs.release-please.outputs.core--release_created == 'true' }}
        run: npm publish -w @skedox/analytics-core --access public --provenance

      # Then publish the rest
      - name: Publish @skedox/analytics-vanilla
        if: ${{ needs.release-please.outputs.vanilla--release_created == 'true' }}
        run: npm publish -w @skedox/analytics-vanilla --access public --provenance

      - name: Publish @skedox/analytics-react
        if: ${{ needs.release-please.outputs.react--release_created == 'true' }}
        run: npm publish -w @skedox/analytics-react --access public --provenance

      - name: Publish @skedox/analytics-vue
        if: ${{ needs.release-please.outputs.vue--release_created == 'true' }}
        run: npm publish -w @skedox/analytics-vue --access public --provenance
